<article class="post-row"><div class="post-meta"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%b %d, %Y' }}</time><span>{{ post.category | default: 'Notes' | escape }}</span></div><div><h3><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h3><p>{{ post.description | default: post.excerpt | strip_html | truncate: 160 | escape }}</p></div><a class="post-read" href="{{ post.url | relative_url }}" aria-label="Read {{ post.title | escape }}">Read article</a></article>
